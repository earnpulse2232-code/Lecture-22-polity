        q: "34. Which Article empowers Parliament to alter state boundaries and form new states?",
        h: "कौन सा अनुच्छेद संसद को राज्य की सीमाओं को बदलने और नए राज्यों का गठन करने का अधिकार देता है?",
        options: [
            "Article 1 (अनुच्छेद 1)",
            "Article 2 (अनुच्छेद 2)",
            "Article 4 (अनुच्छेद 4)",
            "Article 3 (अनुच्छेद 3)"
        ],
        answer: 3,
        explanation: "अनुच्छेद 3 संसद को राज्यों की सीमाओं में परिवर्तन करने और नए राज्यों के गठन की शक्ति प्रदान करता है (अनुच्छेद 4 यह स्पष्ट करता है कि अनुच्छेद 2 और 3 के तहत बनाए गए कानून अनुच्छेद 368 के तहत संविधान संशोधन नहीं माने जाएंगे)."
    },
    {
        q: "35. Which Schedule of the Constitution contains the names of States and Union Territories?",
        h: "संविधान की किस अनुसूची में राज्यों और केंद्र शासित प्रदेशों के नाम शामिल हैं?",
        options: ["First (पहली)", "Second (दूसरी)", "Third (तीसरी)", "Fourth (चौथी)"],
        answer: 0,
        explanation: "पहली अनुसूची (First Schedule) में भारत के सभी राज्यों और केंद्र शासित प्रदेशों के नाम तथा उनके क्षेत्रीय विस्तार का विवरण दिया गया है."
    },
    {
        q: "36. The Land Boundary Agreement with Bangladesh was constitutionalized through which Constitutional Amendment?",
        h: "बांग्लादेश के साथ भूमि सीमा समझौते को किस संवैधानिक संशोधन के माध्यम से संवैधानिकता दी गई थी?",
        options: [
            "Ninety-Seventh Amendment (97वां संशोधन)",
            "Ninety-Eighth Amendment (98वां संशोधन)",
            "One Hundredth Amendment (100वां संशोधन)",
            "One Hundred and First Amendment (101वां संशोधन)"
        ],
        answer: 2,
        explanation: "100वें संविधान संशोधन अधिनियम (2015) के माध्यम से भारत और बांग्लादेश के बीच 1974 के भूमि सीमा समझौते (Land Boundary Agreement) और 2011 के प्रोटोकॉल को लागू करते हुए कुछ क्षेत्रों का आदान-प्रदान किया गया था."
    }
];

let userAnswers = new Array(quizData.length).fill(null);
let startTime = Date.now();

function renderQuiz() {
    const container = document.getElementById('quiz-body');
    container.innerHTML = '';
    quizData.forEach((item, qIdx) => {
        const qBlock = document.createElement('div');
        qBlock.className = 'question-block';
        qBlock.innerHTML = `
            <div class="question-text">
                ${item.q}
                <span class="q-hi">${item.h}</span>
            </div>
            <div class="options-grid" id="opt-container-${qIdx}">
                ${item.options.map((opt, oIdx) => `
                    <button class="option-btn" id="btn-${qIdx}-${oIdx}" onclick="handleOptionClick(${qIdx}, ${oIdx})">${opt}</button>
                `).join('')}
            </div>
            <div class="explanation-box" id="exp-${qIdx}">
                <strong>व्याख्या (Explanation):</strong> ${item.explanation}
            </div>
        `;
        container.appendChild(qBlock);
    });
}

function handleOptionClick(qIdx, selectedIdx) {
    if (userAnswers[qIdx] !== null) return;
    userAnswers[qIdx] = selectedIdx;

    const correctIdx = quizData[qIdx].answer;
    const selectedBtn = document.getElementById(`btn-${qIdx}-${selectedIdx}`);
    const correctBtn = document.getElementById(`btn-${qIdx}-${correctIdx}`);
    const expBox = document.getElementById(`exp-${qIdx}`);

    if (selectedIdx === correctIdx) {
        selectedBtn.classList.add('correct');
    } else {
        selectedBtn.classList.add('incorrect');
        correctBtn.classList.add('correct');
    }

    const allOptions = document.querySelectorAll(`#opt-container-${qIdx} .option-btn`);
    allOptions.forEach(btn => btn.disabled = true);

    expBox.style.display = 'block';
}

function submitQuiz() {
    const totalTime = Math.floor((Date.now() - startTime) / 1000);
    const minutes = Math.floor(totalTime / 60);
    const seconds = totalTime % 60;

    let correctCount = 0;
    let incorrectCount = 0;

    userAnswers.forEach((ans, idx) => {
        if (ans !== null) {
            if (ans === quizData[idx].answer) correctCount++;
            else incorrectCount++;
        }
    });

    const resultBox = document.getElementById('result-box');
    resultBox.style.display = 'block';
    resultBox.innerHTML = `
        कुल प्रश्न: ${quizData.length}<br>
        सही उत्तर: <span style="color:#38a169">${correctCount}</span> | 
        गलत उत्तर: <span style="color:#e53e3e">${incorrectCount}</span> | 
        अनुत्तरित: ${quizData.length - (correctCount + incorrectCount)}<br>
        कुल समय: ${minutes} मिनट ${seconds} सेकंड
    `;
    resultBox.scrollIntoView({ behavior: 'smooth' });
}

window.onload = renderQuiz;
</script>
</body>
</html>
